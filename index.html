<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Voting App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Survey Voting App</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="hero card">
            <h1>Welcome to Survey Voting</h1>
            <p>Create image-based surveys and let people vote for their favorites!</p>
            <div class="hero-buttons">
                <a href="admin.html" class="btn btn-primary">Admin Dashboard</a>
            </div>
        </div>

        <section class="surveys-section">
            <h2>Active Surveys</h2>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading surveys...</p>
            </div>
            <div id="surveys-container" class="card" style="display: none;">
                <ul id="surveys-list" class="survey-list">
                    <!-- Surveys will be loaded here -->
                </ul>
                <p id="no-surveys" style="display: none; text-align: center; color: #888;">
                    No surveys available yet. Create one in the admin dashboard!
                </p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loading = document.getElementById('loading');
            const container = document.getElementById('surveys-container');
            const list = document.getElementById('surveys-list');
            const noSurveys = document.getElementById('no-surveys');

            try {
                const { data: surveys, error } = await db
                    .from('surveys')
                    .select('*')
                    .order('created_at', { ascending: false });

                loading.style.display = 'none';
                container.style.display = 'block';

                if (error) throw error;

                if (!surveys || surveys.length === 0) {
                    noSurveys.style.display = 'block';
                    return;
                }

                surveys.forEach(survey => {
                    const li = document.createElement('li');
                    li.className = 'survey-item';
                    li.innerHTML = `
                        <div>
                            <h3>${escapeHtml(survey.title)}</h3>
                            <span class="date">Created: ${new Date(survey.created_at).toLocaleDateString()}</span>
                        </div>
                        <div class="actions">
                            <a href="vote.html?id=${survey.id}" class="btn btn-primary btn-small">Vote</a>
                            <a href="results.html?id=${survey.id}" class="btn btn-secondary btn-small">Results</a>
                        </div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                loading.innerHTML = `<p class="message message-error">Error loading surveys: ${err.message}</p>`;
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
