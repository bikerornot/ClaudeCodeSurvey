<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Voting App</title>
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 shadow-md">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white tracking-tight">Survey App</h1>
            <nav class="flex gap-1">
                <a href="index.html" class="text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-white/20 transition-colors">Home</a>
                <a href="admin.html" class="text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-white/20 transition-colors">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-20 text-center">

        <div class="bg-white rounded-2xl shadow-sm p-12">
            <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
            </div>
            <h2 class="text-4xl font-bold text-gray-800 mb-4">Survey Voting App</h2>
            <p class="text-lg text-gray-500 mb-3">Create surveys and share them with anyone.</p>
            <p class="text-gray-400 mb-10">Collect votes anonymously — no login required for voters. Sign up to manage your own surveys and view results.</p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="admin.html" class="inline-block bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold px-8 py-3 rounded-xl hover:shadow-lg hover:-translate-y-0.5 transition-all">
                    Log In
                </a>
                <a href="admin.html?signup=true" class="inline-block bg-white border-2 border-gray-200 text-gray-700 font-semibold px-8 py-3 rounded-xl hover:bg-gray-50 transition-all">
                    Sign Up
                </a>
            </div>
        </div>

    </main>
</body>
</html>
