<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Voting App</title>
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="img/logo.png" alt="Veloxo" class="h-9">
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Survey App</h1>
            </div>
            <nav class="flex gap-1">
                <a href="index.html" class="text-gray-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">Home</a>
                <a href="admin.html" class="text-gray-600 text-sm font-medium px-4 py-2 rounded-lg hover:bg-gray-100 transition-colors">Admin</a>
            </nav>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-20 text-center">

        <div class="bg-white rounded-2xl shadow-sm p-12">
            <img src="img/logo.png" alt="Veloxo" class="h-16 mx-auto mb-6">
            <h2 class="text-4xl font-bold text-gray-800 mb-4">Survey Voting App</h2>
            <p class="text-lg text-gray-500 mb-3">Create surveys and share them with anyone.</p>
            <p class="text-gray-400 mb-10">Collect votes anonymously — no login required for voters. Sign up to manage your own surveys and view results.</p>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="admin.html" class="inline-block bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold px-8 py-3 rounded-xl hover:shadow-lg hover:-translate-y-0.5 transition-all">
                    Log In
                </a>
                <a href="admin.html?signup=true" class="inline-block bg-white border-2 border-gray-200 text-gray-700 font-semibold px-8 py-3 rounded-xl hover:bg-gray-50 transition-all">
                    Sign Up
                </a>
            </div>
        </div>

    </main>
</body>
</html>
