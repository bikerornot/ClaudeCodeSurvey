<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Survey Voting App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Admin Dashboard</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>

    <!-- Password Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal">
            <h2>Admin Access</h2>
            <form id="password-form">
                <div class="form-group">
                    <label for="password">Enter Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p id="password-error" class="message message-error" style="display: none; margin-top: 15px;">
                    Incorrect password. Please try again.
                </p>
            </form>
        </div>
    </div>

    <!-- Admin Content (hidden until authenticated) -->
    <main id="admin-content" class="container" style="display: none;">
        <div id="message-container"></div>

        <!-- Admin Navigation -->
        <div class="card" style="text-align: center;">
            <a href="admin.html" class="btn btn-primary" style="margin-right: 10px;">Create Surveys</a>
            <a href="surveys.html" class="btn btn-secondary">View Surveys</a>
        </div>

        <!-- Survey Created Success -->
        <div id="survey-created-box" class="card" style="display: none;">
            <h3 style="color: #28a745; margin-bottom: 15px;">Survey Created Successfully!</h3>
            <div style="margin-bottom: 10px;">
                <strong>Survey link:</strong>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="survey-link-input" readonly style="flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 5px; background: #f8f9fa;">
                <button id="copy-link-btn" class="btn btn-primary">Copy</button>
            </div>
        </div>

        <!-- Create Survey Form -->
        <div class="card">
            <h2>Create New Survey</h2>
            <form id="create-survey-form">
                <div class="form-group">
                    <label for="survey-type">Survey Type</label>
                    <select id="survey-type" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem;">
                        <option value="image">Image Survey</option>
                        <option value="multiple_choice">Multiple Choice (Select One)</option>
                        <option value="checkbox">Checkboxes (Select Multiple)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="survey-title">Survey Title</label>
                    <input type="text" id="survey-title" placeholder="Enter survey title" required>
                </div>
                <div class="form-group">
                    <label for="survey-description">Description</label>
                    <textarea id="survey-description" placeholder="Tell voters what they're choosing between..." rows="3" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <!-- Image Survey Fields -->
                <div id="image-fields">
                    <div class="form-group">
                        <label>Add Images (minimum 2)</label>
                        <input type="file" id="image-input" accept="image/*">
                        <div id="upload-preview" class="upload-preview"></div>
                        <p id="image-count" style="margin-top: 10px; color: #666;">0 images added</p>
                    </div>
                </div>

                <!-- Multiple Choice Fields -->
                <div id="multiple-choice-fields" style="display: none;">
                    <div class="form-group">
                        <label for="mc-question">Question</label>
                        <input type="text" id="mc-question" placeholder="Enter your question">
                    </div>
                    <div class="form-group">
                        <label>Answer Choices</label>
                        <div id="mc-choices-container"></div>
                        <button type="button" class="btn btn-secondary btn-small" onclick="addMCChoice()" style="margin-top: 10px;">+ Add Choice</button>
                    </div>
                </div>

                <!-- Checkbox Fields -->
                <div id="checkbox-fields" style="display: none;">
                    <div class="form-group">
                        <label for="cb-question">Question</label>
                        <input type="text" id="cb-question" placeholder="Enter your question">
                    </div>
                    <div class="form-group">
                        <label>Options (Select all that apply)</label>
                        <div id="cb-choices-container"></div>
                        <button type="button" class="btn btn-secondary btn-small" onclick="addCBChoice()" style="margin-top: 10px;">+ Add Option</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="create-btn">Create Survey</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
