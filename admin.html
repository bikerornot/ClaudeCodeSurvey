<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Survey Voting App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Admin Dashboard</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="admin.html">Admin</a>
            </nav>
        </div>
    </header>

    <!-- Password Modal -->
    <div id="password-modal" class="modal-overlay">
        <div class="modal">
            <h2>Admin Access</h2>
            <form id="password-form">
                <div class="form-group">
                    <label for="password">Enter Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p id="password-error" class="message message-error" style="display: none; margin-top: 15px;">
                    Incorrect password. Please try again.
                </p>
            </form>
        </div>
    </div>

    <!-- Admin Content (hidden until authenticated) -->
    <main id="admin-content" class="container" style="display: none;">
        <div id="message-container"></div>

        <!-- Create Survey Form -->
        <div class="card">
            <h2>Create New Survey</h2>
            <form id="create-survey-form">
                <div class="form-group">
                    <label for="survey-type">Survey Type</label>
                    <select id="survey-type" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem;">
                        <option value="image">Image Survey</option>
                        <option value="multiple_choice">Multiple Choice</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="survey-title">Survey Title</label>
                    <input type="text" id="survey-title" placeholder="Enter survey title" required>
                </div>
                <div class="form-group">
                    <label for="survey-description">Description</label>
                    <textarea id="survey-description" placeholder="Tell voters what they're choosing between..." rows="3" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 1rem; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <!-- Image Survey Fields -->
                <div id="image-fields">
                    <div class="form-group">
                        <label>Add Images (minimum 2)</label>
                        <input type="file" id="image-input" accept="image/*">
                        <div id="upload-preview" class="upload-preview"></div>
                        <p id="image-count" style="margin-top: 10px; color: #666;">0 images added</p>
                    </div>
                </div>

                <!-- Multiple Choice Fields -->
                <div id="multiple-choice-fields" style="display: none;">
                    <div class="form-group">
                        <label for="mc-question">Question</label>
                        <input type="text" id="mc-question" placeholder="Enter your question">
                    </div>
                    <div class="form-group">
                        <label>Answer Choices</label>
                        <input type="text" id="mc-choice-1" placeholder="Choice 1" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 5px;">
                        <input type="text" id="mc-choice-2" placeholder="Choice 2" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 5px;">
                        <input type="text" id="mc-choice-3" placeholder="Choice 3" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 5px;">
                        <input type="text" id="mc-choice-4" placeholder="Choice 4" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 5px;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="create-btn">Create Survey</button>
            </form>
        </div>

        <!-- Existing Surveys -->
        <div class="card">
            <h2>Existing Surveys</h2>
            <div id="surveys-loading" class="loading">
                <div class="spinner"></div>
                <p>Loading surveys...</p>
            </div>
            <ul id="surveys-list" class="survey-list" style="display: none;"></ul>
            <p id="no-surveys" style="display: none; text-align: center; color: #888;">
                No surveys created yet.
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
