<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey List - Survey Voting App</title>
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-gradient-to-r from-indigo-500 to-purple-600 shadow-md">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-white tracking-tight">Survey List</h1>
            <nav class="flex gap-1 items-center">
                <a href="index.html" class="text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-white/20 transition-colors">Home</a>
                <a href="admin.html" class="text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-white/20 transition-colors">Admin</a>
                <button id="logout-btn" onclick="handleLogout()" class="text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-white/20 transition-colors inline-flex items-center gap-1" style="display:none;">
                    Logout
                </button>
            </nav>
        </div>
    </header>

    <!-- Password Modal -->
    <div id="password-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm mx-4">
            <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-gray-800 text-center mb-6">Admin Access</h2>
            <form id="password-form">
                <div class="mb-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter admin email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter admin password" required>
                </div>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-3 rounded-xl hover:shadow-lg hover:-translate-y-0.5 transition-all">
                    Login
                </button>
                <p id="password-error" class="mt-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-center" style="display:none;">
                    Incorrect email or password. Please try again.
                </p>
            </form>
        </div>
    </div>

    <!-- Embed Code Modal -->
    <div id="embed-modal" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50" style="display:none;">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-lg mx-4">
            <h2 class="text-xl font-bold text-gray-800 mb-1">Embed Code</h2>
            <p class="text-sm text-gray-500 mb-4">Copy and paste this into your website or blog:</p>
            <textarea id="embed-code" readonly rows="4" class="w-full px-3 py-2.5 border-2 border-gray-200 rounded-xl font-mono text-sm text-gray-700 bg-gray-50 focus:outline-none resize-none mb-4"></textarea>
            <div class="flex justify-end gap-2">
                <button onclick="closeEmbedModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-4 py-2 rounded-lg transition-colors text-sm">
                    Close
                </button>
                <button onclick="copyEmbedCode()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition-colors text-sm">
                    Copy Code
                </button>
            </div>
        </div>
    </div>

    <!-- Surveys Content -->
    <main id="surveys-content" class="max-w-5xl mx-auto px-6 py-10" style="display:none;">

        <!-- Admin Navigation -->
        <div class="flex gap-3 mb-6">
            <a href="admin.html" class="bg-white text-gray-700 font-semibold px-5 py-2.5 rounded-lg text-sm hover:bg-gray-50 border border-gray-200 transition-colors">
                Create Survey
            </a>
            <a href="surveys.html" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold px-5 py-2.5 rounded-lg text-sm hover:shadow-md transition-all">
                View Surveys
            </a>
        </div>

        <!-- Survey list card -->
        <div class="bg-white rounded-2xl shadow-sm">
            <div class="px-6 py-4 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800">All Surveys</h2>
            </div>

            <!-- Loading -->
            <div id="surveys-loading" class="flex flex-col items-center py-16 text-gray-400">
                <div class="w-10 h-10 border-4 border-gray-200 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
                <p>Loading surveys...</p>
            </div>

            <!-- List -->
            <ul id="surveys-list" class="divide-y divide-gray-100" style="display:none;"></ul>

            <!-- Empty state -->
            <p id="no-surveys" class="text-center text-gray-400 py-12" style="display:none;">
                No surveys created yet.
            </p>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script>
        let surveysInitialized = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const passwordModal   = document.getElementById('password-modal');
            const passwordForm    = document.getElementById('password-form');
            const emailInput      = document.getElementById('email');
            const passwordInput   = document.getElementById('password');
            const passwordError   = document.getElementById('password-error');
            const loginBtn        = document.getElementById('login-btn');
            const surveysContent  = document.getElementById('surveys-content');
            const logoutBtn       = document.getElementById('logout-btn');

            // Pre-hide modal immediately if session exists (prevents flicker)
            const session = await getAdminSession();
            if (session) passwordModal.style.display = 'none';

            db.auth.onAuthStateChange((event, session) => {
                if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && !surveysInitialized) {
                    surveysInitialized = true;
                    passwordModal.style.display = 'none';
                    surveysContent.style.display = 'block';
                    logoutBtn.style.display = 'inline-flex';
                    loadSurveys();
                }
                if (event === 'SIGNED_OUT') {
                    surveysInitialized = false;
                    passwordModal.style.display = 'flex';
                    surveysContent.style.display = 'none';
                    logoutBtn.style.display = 'none';
                }
            });

            passwordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                passwordError.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.textContent = 'Signing in...';
                try {
                    await adminSignIn(emailInput.value.trim(), passwordInput.value);
                } catch (err) {
                    passwordError.style.display = 'block';
                    passwordInput.value = '';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            });
        });

        async function handleLogout() {
            try { await adminSignOut(); }
            catch (err) { alert('Logout failed: ' + err.message); }
        }

        async function loadSurveys() {
            const loading = document.getElementById('surveys-loading');
            const list = document.getElementById('surveys-list');
            const noSurveys = document.getElementById('no-surveys');

            loading.style.display = 'flex';
            list.style.display = 'none';
            noSurveys.style.display = 'none';

            try {
                const { data: surveys, error } = await db
                    .from('surveys')
                    .select('*')
                    .order('created_at', { ascending: false });

                loading.style.display = 'none';

                if (error) throw error;

                if (!surveys || surveys.length === 0) {
                    noSurveys.style.display = 'block';
                    return;
                }

                list.innerHTML = '';
                list.style.display = 'block';

                for (const survey of surveys) {
                    const { count } = await db
                        .from('votes')
                        .select('*', { count: 'exact', head: true })
                        .eq('survey_id', survey.id);

                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between px-6 py-4 hover:bg-gray-50 transition-colors gap-4';

                    const typeBadgeClass = {
                        image: 'bg-purple-100 text-purple-700',
                        multiple_choice: 'bg-blue-100 text-blue-700',
                        checkbox: 'bg-green-100 text-green-700'
                    }[survey.type] || 'bg-gray-100 text-gray-600';

                    const typeLabel = {
                        image: 'Image',
                        multiple_choice: 'Multiple Choice',
                        checkbox: 'Checkbox'
                    }[survey.type] || survey.type;

                    li.innerHTML = `
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-semibold text-gray-800 truncate">${escapeHtml(survey.title)}</h3>
                                <span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-full ${typeBadgeClass}">${typeLabel}</span>
                            </div>
                            <p class="text-sm text-gray-400">
                                Created ${new Date(survey.created_at).toLocaleDateString()}
                                <span class="mx-1.5">·</span>
                                <span class="font-medium text-indigo-500">${count || 0} vote${count !== 1 ? 's' : ''}</span>
                            </p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <button onclick="copyLink('${survey.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">
                                Copy Link
                            </button>
                            <button onclick="showEmbed('${survey.id}')" class="bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">
                                Embed
                            </button>
                            <a href="results.html?id=${survey.id}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors">
                                Results
                            </a>
                        </div>
                    `;
                    list.appendChild(li);
                }
            } catch (err) {
                loading.innerHTML = `<p class="text-center text-red-500 py-8 w-full">Error loading surveys: ${err.message}</p>`;
            }
        }

        function copyLink(surveyId) {
            const voteLink = `${window.location.origin}${window.location.pathname.replace('surveys.html', '')}vote.html?id=${surveyId}`;
            navigator.clipboard.writeText(voteLink).then(() => {
                alert('Vote link copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy. URL: ' + voteLink);
            });
        }

        function showEmbed(surveyId) {
            const baseUrl = window.location.origin + window.location.pathname.replace('surveys.html', '');
            const embedCode = `<iframe src="${baseUrl}vote.html?id=${surveyId}&embed=true" width="100%" height="700" frameborder="0" style="border: 1px solid #ddd; border-radius: 8px;"></iframe>`;
            document.getElementById('embed-code').value = embedCode;
            document.getElementById('embed-modal').style.display = 'flex';
        }

        function closeEmbedModal() {
            document.getElementById('embed-modal').style.display = 'none';
        }

        function copyEmbedCode() {
            const embedCode = document.getElementById('embed-code');
            embedCode.select();
            navigator.clipboard.writeText(embedCode.value).then(() => {
                alert('Embed code copied to clipboard!');
                closeEmbedModal();
            }).catch(() => {
                alert('Failed to copy. Please copy manually.');
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
